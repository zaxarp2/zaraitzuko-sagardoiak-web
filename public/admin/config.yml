# Configuración de Sveltia CMS
# --------------------------------------------------------------------
# Para activarlo hace falta un repositorio en GitHub (ver DESPLIEGUE).
# Rellena `repo` con  usuario/repositorio  y elige la rama.
backend:
  name: github
  repo: zaxarp2/zaraitzuko-sagardoiak-web
  branch: main
  # Inicio de sesión con GitHub a través del proveedor OAuth del proyecto de Netlify
  # (la web ya no se aloja en Netlify; solo se usa para el login del editor)
  base_url: https://api.netlify.com
  site_domain: zaraitzuko-sagardoiak.netlify.app

# Bilingüe: cada variedad/noticia vive como carpeta por idioma (es/ · eu/)
i18n:
  structure: multiple_folders
  locales: [es, eu]
  default_locale: es

media_folder: "public/uploads"
public_folder: "/uploads"

# Las fotos que se suben desde el editor se reducen y se convierten a WebP en el navegador
# (así no pesan y pierden los metadatos de la cámara, GPS incluido).
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

collections:
  - name: variedades
    label: Variedades
    label_singular: Variedad
    folder: src/content/variedades
    create: true
    i18n: true
    identifier_field: name
    summary: "{{especie}} · {{n}} · {{name}}"
    sortable_fields: [n, name]
    fields:
      - { name: especie, label: "Especie", widget: select, default: manzana, i18n: duplicate,
          options: [ {label: "Manzana", value: manzana}, {label: "Pera", value: pera} ] }
      - { name: n, label: "Orden en el catálogo", widget: number, value_type: float, i18n: duplicate,
          hint: "La web numera sola (1, 2, 3…) siguiendo este orden. Para meter una variedad entre la 1 y la 2, pon 1.5; el resto se renumera automáticamente." }
      - { name: name, label: "Nombre", widget: string, i18n: duplicate }
      - { name: status, label: "Estado (se pueden marcar varios)", widget: select, multiple: true, min: 1, i18n: duplicate,
          options: [ {label: "Validada", value: confirmed}, {label: "Pendiente molecular", value: pending}, {label: "Pendiente fruto", value: fruto}, {label: "Pendiente más información", value: info} ] }
      - { name: epoca, label: "Época de recolección", widget: select, required: false, i18n: duplicate,
          options: [ {label: "Temprana", value: temprana}, {label: "Media", value: media}, {label: "Tardía", value: tardia} ] }
      - { name: ambito, label: "Presencia fuera del Valle", widget: select, required: false, i18n: duplicate,
          options: [ {label: "Solo registrada en el Valle", value: valle}, {label: "Presente fuera del Valle", value: fuera} ] }
      - { name: fueraNombres, label: "Nombres fuera del Valle", widget: string, required: false, i18n: duplicate,
          hint: "Solo si está presente fuera del Valle (p. ej. «Reineta Blanca» o «Carapanón / Reineta del Camino»)." }
      - { name: extension, label: "Extensión", widget: select, required: false, i18n: duplicate,
          options: [ {label: "Antes extendida", value: extendida}, {label: "Minoritaria", value: minoritaria} ] }
      - { name: color, label: "Color (hex)", widget: string, i18n: duplicate }
      - { name: colorAlt, label: "Color secundario (hex)", widget: string, i18n: duplicate }
      - { name: pueblos, label: "Localizada en (pueblos)", widget: list, field: {name: p, label: Pueblo, widget: string}, i18n: duplicate }
      - { name: fotos, label: "Fotos (carrusel)", widget: list, required: false, i18n: duplicate,
          summary: "{{fields.src}}",
          fields: [ {name: src, label: "Imagen", widget: image}, {name: pie, label: "Pie de foto", widget: string, required: false} ] }
      - { name: otrosPueblos, label: "Otras citas", widget: list, required: false, field: {name: p, label: Pueblo, widget: string}, i18n: duplicate }
      # --- Campos bilingües (uno por idioma) ---
      - { name: antig, label: "Presencia en el Valle", widget: string, required: false, i18n: true }
      - { name: quote, label: "Cita literal", widget: string, required: false, i18n: true }
      - { name: estado, label: "Estado de conservación", widget: markdown, required: false, i18n: true }
      - { name: potencial, label: "Potencial de reintroducción", widget: markdown, required: false, i18n: true }
      - { name: fruto, label: "Descripción morfológica del fruto", widget: markdown, required: false, i18n: true }
      - { name: molecular, label: "Caracterización molecular", widget: markdown, required: false, i18n: true }
      - { name: valoracion, label: "Conocimiento local · Valoración", widget: markdown, required: false, i18n: true }
      - { name: abundancia, label: "Conocimiento local · Abundancia relativa", widget: markdown, required: false, i18n: true }
      - { name: origen, label: "Conocimiento local · Origen", widget: markdown, required: false, i18n: true }
      - { name: recogida, label: "Conocimiento local · Recogida y maduración", widget: markdown, required: false, i18n: true }
      - { name: usos, label: "Conocimiento local · Usos citados", widget: markdown, required: false, i18n: true }
      - { name: otrasCar, label: "Conocimiento local · Otras características", widget: markdown, required: false, i18n: true }
      - { name: obs, label: "Observaciones", widget: markdown, required: false, i18n: true }

  - name: noticias
    label: Diario
    label_singular: Entrada
    folder: src/content/noticias
    create: true
    i18n: true
    identifier_field: title
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, date]
    fields:
      - { name: order, label: "Orden", widget: number, value_type: int, i18n: duplicate }
      - { name: date, label: "Fecha (texto)", widget: string, i18n: true }
      - { name: tag, label: "Etiqueta", widget: string, i18n: true }
      - { name: title, label: "Título", widget: string, i18n: true }
      - { name: resumen, label: "Resumen (tarjeta de portada)", widget: text, required: false, i18n: true }
      - { name: body, label: "Texto", widget: markdown, i18n: true }

  - name: textos
    label: Textos de portada
    files:
      - name: portada
        label: "Portada (inicio, cifras e introducciones)"
        file: src/data/portada.json
        format: json
        fields:
          - name: es
            label: "Castellano"
            widget: object
            collapsed: false
            fields:
              - name: inicio
                label: "Inicio (cabecera de la portada)"
                widget: object
                fields:
                  - { name: antetitulo, label: "Antetítulo", widget: string }
                  - { name: titulo, label: "Título", widget: string, hint: "Lo que va entre <em> y </em> sale en cursiva y en color." }
                  - { name: entradilla, label: "Introducción", widget: text }
                  - name: cifras
                    label: "Cifras"
                    label_singular: "Cifra"
                    widget: list
                    summary: "{{fields.num}} · {{fields.texto}}"
                    fields:
                      - { name: num, label: "Número", widget: string }
                      - { name: texto, label: "Texto", widget: string }
              - name: manzanas
                label: "Sección Manzanas"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
              - name: peras
                label: "Sección Peras"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
              - name: diario
                label: "Sección Diario"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
              - name: asociacion
                label: "Sección Asociación"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
                  - name: bloques
                    label: "Bloques"
                    label_singular: "Bloque"
                    widget: list
                    summary: "{{fields.titulo}}"
                    fields:
                      - { name: titulo, label: "Título", widget: string }
                      - { name: texto, label: "Texto", widget: text }
                  - { name: socioTitulo, label: "Hazte socio · título", widget: string }
                  - { name: socioTexto, label: "Hazte socio · texto", widget: text, hint: "Puede llevar el enlace de correo tal cual está." }
          - name: eu
            label: "Euskera"
            widget: object
            collapsed: true
            fields:
              - name: inicio
                label: "Inicio (cabecera de la portada)"
                widget: object
                fields:
                  - { name: antetitulo, label: "Antetítulo", widget: string }
                  - { name: titulo, label: "Título", widget: string, hint: "Lo que va entre <em> y </em> sale en cursiva y en color." }
                  - { name: entradilla, label: "Introducción", widget: text }
                  - name: cifras
                    label: "Cifras"
                    label_singular: "Cifra"
                    widget: list
                    summary: "{{fields.num}} · {{fields.texto}}"
                    fields:
                      - { name: num, label: "Número", widget: string }
                      - { name: texto, label: "Texto", widget: string }
              - name: manzanas
                label: "Sección Manzanas"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
              - name: peras
                label: "Sección Peras"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
              - name: diario
                label: "Sección Diario"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
              - name: asociacion
                label: "Sección Asociación"
                widget: object
                fields:
                  - { name: titulo, label: "Título", widget: string }
                  - { name: entradilla, label: "Introducción", widget: text }
                  - name: bloques
                    label: "Bloques"
                    label_singular: "Bloque"
                    widget: list
                    summary: "{{fields.titulo}}"
                    fields:
                      - { name: titulo, label: "Título", widget: string }
                      - { name: texto, label: "Texto", widget: text }
                  - { name: socioTitulo, label: "Hazte socio · título", widget: string }
                  - { name: socioTexto, label: "Hazte socio · texto", widget: text, hint: "Puede llevar el enlace de correo tal cual está." }
